name: Daily PD Research Digest

on:
  schedule:
    - cron: '50 12 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Report date (YYYY-MM-DD), leave empty for today'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Determine report date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "date=${{ github.event.inputs.date }}" >> "$GITHUB_OUTPUT"
          else
            TZ='Asia/Taipei' date '+%Y-%m-%d' | { read d; echo "date=$d" >> "$GITHUB_OUTPUT"; }
          fi

      - name: Fetch papers from PubMed
        run: node scripts/fetch-papers.js --days 7 --max-papers 50 --json --output papers.json
        env:
          REPORT_DATE: ${{ steps.date.outputs.date }}
        timeout-minutes: 10

      - name: Check paper count
        id: papers
        run: |
          count=$(node -e "const d=require('./papers.json'); console.log(d.papers?.length || 0)")
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo "::warning::No new papers found"
          fi

      - name: Generate AI report
        if: steps.papers.outputs.count != '0'
        run: node scripts/generate-report.js --input papers.json --output docs/parkinson-${{ steps.date.outputs.date }}.html
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          REPORT_DATE: ${{ steps.date.outputs.date }}
        timeout-minutes: 15

      - name: Generate index page
        if: steps.papers.outputs.count != '0'
        run: node scripts/generate-index.js

      - name: Commit and push
        if: steps.papers.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ papers.json
          git diff --cached --quiet || git commit -m "daily: parkinson report ${{ steps.date.outputs.date }}"
          git pull --rebase origin main
          git push origin main
